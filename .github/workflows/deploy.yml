name: CI/CD - Build & Deploy to Azure Container Apps

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Azure Container Registry (ACR)
        uses: docker/login-action@v3
        with:
          registry: acrcattleweightai.azurecr.io
          username: ${{ secrets.ACR_USERNAME }}
          password: ${{ secrets.ACR_PASSWORD }}

      - name: Build and Push Docker Image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: |
            acrcattleweightai.azurecr.io/baif-cattleweight-app:latest
            acrcattleweightai.azurecr.io/baif-cattleweight-app:${{ github.sha }}

      - name: Azure CLI Login
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Update Azure Container App Deployment
        run: |
          az containerapp update \
            --name baif-cattleweight-app \
            --resource-group rg-baif-cattleweight \
            --image acrcattleweightai.azurecr.io/baif-cattleweight-app:${{ github.sha }}
